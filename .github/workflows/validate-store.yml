name: Validate Moneyhi11s Store

on:
  pull_request:
    branches: [main]
  push:
    branches: [moneyhi11s-store-2026]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
